name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/validate-skills.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check council script syntax
        shell: bash
        run: |
          for script in agent-council/scripts/*.mjs agent-council/providers/*/*.mjs agent-council/providers/shared.mjs; do
            node --check "$script"
          done
